name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The born-green gate: the same script a laptop runs. The store is SQLite
  # (D38), so every database test makes its own files and nothing is
  # provisioned here; scripts/gate-rust.sh names every test that skipped.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact version; the action installs that one
      # (the guests job needs the exact patch, or the committed .wasm differs).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: gate
        run: ./scripts/gate-rust.sh

  # Separate from `gate` on purpose: this job downloads a ~115 MB browser, and a
  # lint failure should not wait behind it. Each Playwright worker gives its
  # daemon a store directory of its own, so workers cannot see each other's
  # events; these specs assert on what a stream did NOT deliver, and a stray
  # event would look like a filter bug.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      # Built here rather than in globalSetup so the cargo cache above covers
      # it and a compile error reads as a build failure, not a Playwright one.
      - name: build the daemon
        run: cargo build -p hive-sandbox

      - name: install
        working-directory: test/e2e
        run: npm ci

      - name: typecheck
        working-directory: test/e2e
        run: npm run typecheck

      - name: install chromium
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      - name: e2e
        working-directory: test/e2e
        env:
          HIVE_SANDBOX_E2E_BINARY: ${{ github.workspace }}/target/debug/hive-sandbox
        run: npx playwright test

      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/
          retention-days: 7

  # The guest source and the committed .wasm drifting apart is what this job
  # catches: the gate tests run against the checked-in artifact, so a change to
  # apps/hello that nobody rebuilt would pass. This rebuilds from source with
  # the pinned toolchain, refuses a diff, and runs the host suite against the
  # fresh bytes.
  guests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guest

      - name: rebuild guests from source
        run: ./scripts/build-guests.sh

      # On a mismatch the step says WHERE the bytes differ, not only that they
      # do: a one-byte drift between two toolchain patch levels is invisible in
      # a diff --stat and obvious in a strings diff.
      - name: the committed guest matches its source
        run: |
          if ! git diff --quiet -- crates/hive-wasmhost/testdata; then
            echo "crates/hive-wasmhost/testdata is out of date with apps/; commit the rebuilt files:"
            git --no-pager diff --stat -- crates/hive-wasmhost/testdata
            for f in $(git diff --name-only -- crates/hive-wasmhost/testdata); do
              git show "HEAD:$f" > /tmp/committed.wasm
              echo "== $f: first differing bytes (offset, committed, rebuilt)"
              cmp -l /tmp/committed.wasm "$f" | head -20 || true
              echo "== $f: strings that differ (< committed, > rebuilt)"
              diff <(strings -n 6 /tmp/committed.wasm) <(strings -n 6 "$f") | head -40 || true
            done
            exit 1
          fi

      - name: guest crates are fmt and clippy clean
        working-directory: guest
        run: cargo fmt --all --check && cargo clippy --workspace --target wasm32-wasip1 -- -D warnings

      - name: host suite against the fresh guest
        run: cargo test -p hive-wasmhost -p hive-registry

  # The egress claim ... a harness has no route out and an agent that ignores
  # HTTP_PROXY fails rather than escapes ... is proven by exactly one test, and
  # it runs only where the images exist. This job builds them and pins them
  # in-job, where the digest is real for this run, and sets
  # HIVE_SANDBOX_REQUIRE_CONTAINER_TESTS so a precondition that is not met
  # FAILS rather than skips. A skip is right on a laptop that never built a
  # harness; it is wrong in the one environment that promised to.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - name: podman version
        run: podman version

      # Only the claude runtime: the egress test drives one image, and building
      # three would triple the job for nothing.
      - name: build the harness image
        run: ./scripts/harness-build.sh claude

      - name: build the egress proxy image
        run: ./scripts/egress-build.sh

      # The process-app fixture (D53, #163): the smallest app that speaks the
      # runtime's protocol over the socket the host mounts, so the container
      # tier proves the host's side and not an SDK.
      - name: build the app test image
        run: ./scripts/app-test-build.sh

      # The reference Bun app (D53 §3, scenario 1), from the one Containerfile
      # every runtime: bun app is built with.
      - name: build the reference app image
        run: ./scripts/app-build.sh apps/hello-bun

      - name: the pins exist
        run: |
          cat docker/harness/digests.json
          cat docker/egress/digest.json
          cat docker/app-test/digest.json
          cat apps/hello-bun/image.json

      - name: container tests, where a skip is a failure
        env:
          HIVE_SANDBOX_REQUIRE_CONTAINER_TESTS: "1"
        run: |
          cargo test -p hive-harness --test supervisor -- podman_runs_the_pinned_image egress_proxy_enforces_the_allowlist egress_proxy_that_dies_reports_its_exit
          cargo test -p hive-apps --test podman -- --nocapture
          cargo test -p hive-apps --test podman_bun -- --nocapture

      - name: nothing outlived the run
        if: ${{ always() }}
        run: |
          echo "containers:"
          podman ps --all --filter 'name=hive-sandbox-' --format '{{.Names}}'
          echo "networks:"
          podman network ls --format '{{.Name}}' | grep hive-sandbox || echo "  (none)"

  # The Postgres engine (D43). The gate job runs every database test on
  # SQLite, which needs nothing; this job runs the crates that speak Postgres
  # against a real server, and sets HIVE_SANDBOX_REQUIRE_DATABASE_TESTS so a
  # test that would skip for want of the URL FAILS instead ... this is the one
  # job that promised a server, and a skip here is the "never executes" shape.
  # The crate list grows as D43 phase 1 ports them (#127); a crate not in it
  # has not been ported, and the PR that ports it adds it here.
  # The TypeScript SDK a process app is written against (D53 §2, #168). Bun
  # is the runtime (house standard, page 1921): its tests run under `bun
  # test` against a fake daemon, and `tsc` holds the types. No daemon and no
  # container: the host's side of the same contract is hive-apps' suite.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: install
        run: bun install --frozen-lockfile

      - name: types
        working-directory: packages/hive-app
        run: bunx tsc --noEmit -p tsconfig.json

      - name: tests
        working-directory: packages/hive-app
        run: bun test

      - name: the reference app type-checks
        working-directory: apps/hello-bun
        run: bunx tsc --noEmit -p tsconfig.json

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The cluster runs Postgres 17 with pgvector (D43, infra notes); the
        # same image here so the extension D41 needs is available to a
        # migration without a superuser.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hive -d hive_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      HIVE_SANDBOX_TEST_DATABASE_URL: postgres://hive:hive@localhost:5432/hive_test?sslmode=disable
      HIVE_SANDBOX_REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      # pg_isready passing is the container's view; this is a connect from
      # where the tests connect from, which is the instrument whose failure
      # mode matches "the tests cannot reach it".
      - name: the server answers from the runner
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=hive psql -h localhost -U hive -d hive_test -tAc 'select 1' 2>/dev/null | grep -q 1; then
              echo "postgres answers"; exit 0
            fi
            sleep 1
          done
          echo "postgres never answered from the runner" >&2; exit 1

      # The image ships pgvector but a database does not have the extension
      # until something creates it; on the cluster it is pre-installed in
      # template1 (D43, infra notes) and scripts/db-up.sh does the same for
      # the local container. Here the job is the operator. `WITH SCHEMA
      # public` because the fixture's search_path ends in public and a test
      # schema is dropped with its test (hive-testdb).
      - name: the vector extension exists in the test database
        run: |
          PGPASSWORD=hive psql -h localhost -U hive -d hive_test -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public'

      - name: database tests, where a skip is a failure
        run: |
          log=$(mktemp)
          cargo test -p hive-db -p hive-schema -p hive-testdb -p hive-store -p hive-blob -p hive-chat -p hive-bus -p hive-models -p hive-surfaces -p hive-httpapi -- --nocapture 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if grep -E '^SKIPPED: ' "$log"; then
            echo "a database test skipped in the job that promised a database" >&2
            exit 1
          fi
          exit "$status"

      # The require flag is what makes the step above honest, so this step
      # watches it fail: with the URL removed and the flag kept, the fixture
      # must refuse rather than quietly test the file engine. A guard nobody
      # has seen fire is a comment, not a guard.
      - name: the require flag refuses a missing server
        env:
          HIVE_SANDBOX_TEST_DATABASE_URL: ""
        run: |
          # pipefail, or `if` reads tee's exit and the refusal reads as a run.
          set -o pipefail
          if cargo test -p hive-testdb -- a_fresh_store_is_migrated_and_private 2>&1 | tee /tmp/require.log; then
            echo "the fixture ran on SQLite with HIVE_SANDBOX_REQUIRE_DATABASE_TESTS=1 set" >&2
            exit 1
          fi
          grep -q 'forbids falling back to SQLite' /tmp/require.log

      # The daemon itself on Postgres (D43): a URL in place of --data-dir, a
      # fresh database so the migrations run from nothing, and /readyz has to
      # say the store is ok. The tests above prove the crates; this proves the
      # process that composes them opens the engine, migrates it and serves.
      # serve-api only, as the local smoke was run; the other roles are the
      # e2e job's business and need nothing from the engine the api does not.
      - name: the daemon serves on Postgres by URL
        run: |
          set -o pipefail
          PGPASSWORD=hive psql -h localhost -U hive -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE hive_smoke'
          PGPASSWORD=hive psql -h localhost -U hive -d hive_smoke -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public'
          cargo build -p hive-sandbox
          blobs=$(mktemp -d); log=$(mktemp)
          HIVE_SANDBOX_DATABASE_URL=postgres://hive:hive@localhost:5432/hive_smoke             target/debug/hive-sandbox --addr 127.0.0.1:7999 --plain-http --blob-root "$blobs"               --run-chat=false --run-workflows=false --run-models=false > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7999/healthz >/dev/null 2>&1 && break; sleep 0.5; done
          ready=$(curl -sS http://127.0.0.1:7999/readyz)
          echo "readyz: $ready"
          kill "$pid"; wait "$pid" || true
          grep -E 'store open engine=postgres' "$log"
          grep -E 'migrated versions=' "$log"
          echo "$ready" | grep -q '"store":"ok"'
          tables=$(PGPASSWORD=hive psql -h localhost -U hive -d hive_smoke -tAc "select count(*) from information_schema.tables where table_schema='public'")
          echo "tables migrated into hive_smoke: $tables"
          [ "$tables" -gt 20 ]

      # Every fixture drops its schema on the way out. One left behind means a
      # drop failed (a lock the test's connection still held, say) and the
      # fixture only printed about it; here it is red.
      - name: no test schema outlived its fixture
        run: |
          left=$(PGPASSWORD=hive psql -h localhost -U hive -d hive_test -tAc "select count(*) from pg_namespace where nspname like 't\_%'")
          echo "test schemas left behind: $left"
          [ "$left" = "0" ]
