# The hive-sandbox daemon, in Rust (docs/design/D24-rust-rewrite.md).
#
# One workspace at the repo root. The guest SDK under guest/ and the apps under
# apps/*/ are their own workspaces, excluded here for the same reason the Go
# tree kept them in separate modules: they only build for wasm32-wasip1, and
# `cargo build --workspace` on the host target must never try to link them.
[workspace]
members = [
    "crates/hive-identity",
    "crates/hive-trust",
    "crates/hive-db",
    "crates/hive-testdb",
    "crates/hive-schema",
    "crates/hive-store",
    "crates/hive-blob",
    "crates/hive-manifest",
    "crates/hive-wasmhost",
    "crates/hive-registry",
    "crates/hive-mcp",
    "crates/hive-surfaces",
    "crates/hive-sse",
    "crates/hive-httpauth",
    "crates/hive-bus",
    "crates/hive-harness",
    "crates/hive-egress",
    "crates/hive-chat",
    "crates/hive-models",
    "crates/hive-webui",
    "crates/hive-httpapi",
    "crates/hive-repodocs",
    "crates/hive-sandbox",
]
exclude = ["guest", "apps/hello"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# SQLite, bundled and vanilla (D38). The libSQL fork was the first pick and
# was measured out: its crate corrupts the heap on Windows past about ten open
# connections per process (hive-db's docs have the reproduction). hive-db is
# the seam; the engine swaps there when the fork is fixed or phase 3 needs it.
rusqlite = { version = "0.37", features = ["bundled"] }
sqlite-vec = "0.1"
# Postgres, the server store (D43 §7). tokio-postgres rather than sqlx: no
# compile-time checking against a live database (the gate runs with nothing
# up), prepared statements, LISTEN on a connection of its own, no native
# library. deadpool-postgres is the pool. rustls is the TLS, the stack reqwest
# already links, with the ring provider named explicitly so a second provider
# arriving by feature unification cannot make the config builder panic.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# raw_value so a document, an event body and a stream-json line travel as the
# bytes they arrived as. NOT preserve_order: the surface hash relies on sorted
# keys, exactly as the Go tree relied on encoding/json sorting them.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bytes = "1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
regex = "1"
rand = "0.9"
parking_lot = "0.12"
tempfile = "3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1"] }
axum = { version = "0.8", features = ["macros", "json", "query", "http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
mime = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
mime_guess = "2"
askama = "0.16"
serde_urlencoded = "0.7"
socket2 = "0.6"
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime", "async", "std", "parallel-compilation", "cache", "wat"] }
wasmtime-wasi = { version = "48", default-features = false, features = ["p1"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
# The Go host had no CGo anywhere. This is that rule in the new language.
# `deny`, not `forbid`: hive-db carries the one `unsafe` the engine needs
# (registering sqlite-vec, D41) under its own allow, and hive-repodocs holds
# every other crate to none. A forbid could not be lifted for that one.
unsafe_code = "deny"

[profile.release]
lto = true
strip = true
opt-level = 3
