# The whole thing, running.
#
#   podman compose -f docker/docker-compose.stack.yml up -d
#   curl localhost:7979/readyz
#
# The daemon and its volumes. One command from a bare machine to something
# answering on 7979. The store is SQLite files on the `data` volume (D38):
# there is no database container, and a backup is a copy of those files
# taken while the daemon is stopped, or `sqlite3 hive.db ".backup out.db"`
# while it runs.
name: hive-sandbox

services:
  hive-sandbox:
    image: localhost/hive-sandbox:latest
    build:
      context: ..
      dockerfile: docker/hive-sandbox/Containerfile
      target: daemon
    restart: unless-stopped
    environment:
      # The store: hive.db and hive-audit.db, created on first boot and
      # migrated on every boot. Migrations are one-way, so copy the volume
      # before upgrading the image.
      HIVE_SANDBOX_DATA_DIR: /var/lib/hive/data
      # Invariant 13. A harness container runs --network=none with this socket
      # bind-mounted, because on rootless Podman an --internal network has no
      # gateway and cannot reach the host at all. The daemon serves the same
      # handler here and on the port.
      HIVE_SANDBOX_UNIX_SOCKET: /run/hive/api.sock
      HIVE_SANDBOX_BOOTSTRAP_HANDLE: ${HIVE_BOOTSTRAP_HANDLE:-}
      HIVE_SANDBOX_BOOTSTRAP_ORG: ${HIVE_BOOTSTRAP_ORG:-}
      HIVE_SANDBOX_BOOTSTRAP_TOKEN: ${HIVE_BOOTSTRAP_TOKEN:-}
    ports:
      - "${HIVE_ADDR:-127.0.0.1:7979}:7979"
    volumes:
      # Shared with harness containers, which get it bind-mounted and reach the
      # API through it with no network at all.
      - runsock:/run/hive
      - data:/var/lib/hive/data
      - blobs:/var/lib/hive/blobs
    # NO healthcheck, deliberately. The image is distroless/static: no shell,
    # no curl, no wget. A CMD-SHELL probe here would exit 127 every interval
    # and gate nothing while looking like it gated something -- the exact
    # failure this repo has hit before. /readyz is the probe; run it from
    # outside, or from an orchestrator that speaks httpGet natively.
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  blobs:
  # The socket lives in a volume rather than a host path so a harness container
  # can be handed it by name without the daemon knowing where the host keeps it.
  runsock:
